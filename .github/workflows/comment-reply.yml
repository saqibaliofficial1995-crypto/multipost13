name: Comment Reply

on:
  schedule:
    - cron: '20 5,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not post replies)'
        required: false
        default: false
        type: boolean

concurrency:
  group: multipost13-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client requests

      - name: Run Comment Reply
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -m src.comment_reply $ARGS

      - name: Commit state updates
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "hashirali3736-star"
          git config user.email "hashirali3736@gmail.com"
          git add state/replied.json
          git diff --staged --quiet || git commit -m "Automated state update: replied comments [skip ci]"
          git push origin main
